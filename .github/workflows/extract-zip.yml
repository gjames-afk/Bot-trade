name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Move project files to root
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          INNER_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$INNER_DIR" ]; then
            cp -a "$INNER_DIR"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Show final project
        run: |
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Dollarzones project"
            git push
          fi
